name: Deploy Storefront Demo (GitHub Pages)

on:
  push:
    branches: [feat/monorepo-import, main]
    paths:
      - "apps/storefront/**"
      - "packages/**"
      - ".github/workflows/deploy-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build demo storefront
        run: npx vite build --base=/restropulse-v2/
        working-directory: apps/storefront
        env:
          VITE_DEMO_MODE: "true"
          VITE_API_URL: /api
      - name: SPA fallback + nojekyll
        run: |
          cp apps/storefront/dist/index.html apps/storefront/dist/404.html
          touch apps/storefront/dist/.nojekyll
      - name: Push to gh-pages
        run: |
          cd apps/storefront/dist
          git init -q -b gh-pages
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -qm "deploy: storefront demo ($GITHUB_SHA)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
