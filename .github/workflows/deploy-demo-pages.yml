name: Deploy Demo (GitHub Pages)

# Publishes the static demo preview (VITE_DEMO_MODE=true, no backend):
#   - storefront at https://<user>.github.io/restropulse-v2/
#   - merchant dashboard (admin) at https://<user>.github.io/restropulse-v2/admin/

on:
  push:
    branches: [feat/monorepo-import, main]
    paths:
      - "apps/storefront/**"
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/deploy-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build workspace packages (shared, telemetry)
        run: npx turbo build --filter=@restropulse/shared --filter=@restropulse/telemetry
      - name: Build demo storefront (site root)
        run: npx vite build --base=/restropulse-v2/
        working-directory: apps/storefront
        env:
          VITE_DEMO_MODE: "true"
          VITE_API_URL: /api
      - name: Build demo admin dashboard (under /admin/)
        run: npx vite build --base=/restropulse-v2/admin/ --outDir dist-demo
        working-directory: apps/web
        env:
          VITE_DEMO_MODE: "true"
          VITE_API_URL: /api
      - name: Assemble site (storefront at root, admin under /admin) + SPA fallbacks + nojekyll
        run: |
          mkdir -p apps/storefront/dist/admin
          cp -R apps/web/dist-demo/. apps/storefront/dist/admin/
          cp apps/storefront/dist/index.html apps/storefront/dist/404.html
          cp apps/storefront/dist/admin/index.html apps/storefront/dist/admin/404.html
          touch apps/storefront/dist/.nojekyll
      - name: Push to gh-pages
        run: |
          cd apps/storefront/dist
          git init -q -b gh-pages
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -qm "deploy: storefront + admin demo ($GITHUB_SHA)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
