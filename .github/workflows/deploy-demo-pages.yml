name: Deploy Demo (GitHub Pages)

# The GitHub Pages demo is RETIRED — every old demo URL now redirects to the
# live production apps on Vercel, so there is exactly one functional product:
#   /            -> https://restropulse-landingpage.vercel.app
#   /demo        -> https://restropulse-storefront.vercel.app/bawarchi
#   /admin       -> https://restropulse-admin.vercel.app
#   /admin-v2    -> https://restropulse-admin.vercel.app

on:
  push:
    branches: [feat/monorepo-import, feat/vercel-deploy, main]
    paths:
      - ".github/workflows/deploy-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build redirect pages
        run: |
          mkdir -p site/demo site/admin site/admin-v2
          redirect () {
            printf '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta http-equiv="refresh" content="0; url=%s">\n<meta name="robots" content="noindex">\n<title>RestroPulse has moved</title>\n<script>location.replace("%s");</script>\n</head>\n<body style="font-family:system-ui;padding:3rem;text-align:center">\n<p>RestroPulse has moved. If you are not redirected, <a href="%s">continue to the live app</a>.</p>\n</body>\n</html>\n' "$2" "$2" "$2" > "$1"
          }
          redirect site/index.html          "https://restropulse-landingpage.vercel.app"
          redirect site/demo/index.html     "https://restropulse-storefront.vercel.app/bawarchi"
          redirect site/admin/index.html    "https://restropulse-admin.vercel.app"
          redirect site/admin-v2/index.html "https://restropulse-admin.vercel.app"
          redirect site/404.html            "https://restropulse-landingpage.vercel.app"
          touch site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Redirect retired GitHub Pages demo to production"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
